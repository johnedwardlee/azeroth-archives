name: Validate desktop app

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm and Node.js
        uses: pnpm/setup@v1
        with:
          version: 11
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests and production build
        run: pnpm test

      - name: Validate bundled content schema
        run: node content-tools/validate_content_pack.cjs content-packs/warcraft5e-campaign.w5e

      - name: Audit bundled content text
        run: python content-tools/audit_warcraft5e_pack.py
