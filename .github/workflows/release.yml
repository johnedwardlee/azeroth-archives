name: Release Windows app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm and Node.js
        uses: pnpm/setup@v1
        with:
          version: 11
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches app version
        shell: pwsh
        run: |
          $package = Get-Content package.json | ConvertFrom-Json
          $expectedTag = "v$($package.version)"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $expectedTag."
          }

      - name: Build Windows release
        run: pnpm release:win

      - name: Publish GitHub release
        shell: pwsh
        run: |
          $package = Get-Content package.json | ConvertFrom-Json
          $tag = $env:GITHUB_REF_NAME

          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $package.version --generate-notes
          }

          $releaseAssets = @(
            (Get-Item "release/Azeroth-Archives-Setup-$($package.version).exe").FullName
            (Get-Item "release/Azeroth-Archives-Setup-$($package.version).exe.blockmap").FullName
            (Get-Item "release/latest.yml").FullName
          )
          & gh release upload $tag $releaseAssets --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release asset upload failed."
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
