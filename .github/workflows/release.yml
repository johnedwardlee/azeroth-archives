name: Release Windows app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm and Node.js
        uses: pnpm/setup@v1
        with:
          version: 11
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests and production build
        run: pnpm test

      - name: Validate bundled content schema
        run: node content-tools/validate_content_pack.cjs content-packs/warcraft5e-campaign.w5e

      - name: Audit bundled content text
        run: python content-tools/audit_warcraft5e_pack.py

      - name: Verify tag matches app version
        shell: pwsh
        run: |
          $package = Get-Content package.json | ConvertFrom-Json
          $expectedTag = "v$($package.version)"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $expectedTag."
          }

      - name: Build Windows release
        run: pnpm release:win

      - name: Create installer checksum
        shell: pwsh
        run: |
          $package = Get-Content package.json | ConvertFrom-Json
          $installer = Get-Item "release/Azeroth-Archives-Setup-$($package.version).exe"
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *$($installer.Name)" | Set-Content "$($installer.FullName).sha256" -Encoding ascii

      - name: Publish GitHub release
        shell: pwsh
        run: |
          $package = Get-Content package.json | ConvertFrom-Json
          $tag = $env:GITHUB_REF_NAME

          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            if ($package.version -match "-") {
              gh release create $tag --title $package.version --generate-notes --prerelease
            } else {
              gh release create $tag --title $package.version --generate-notes
            }
          }

          $releaseAssets = @(
            (Get-Item "release/Azeroth-Archives-Setup-$($package.version).exe").FullName
            (Get-Item "release/Azeroth-Archives-Setup-$($package.version).exe.blockmap").FullName
            (Get-Item "release/Azeroth-Archives-Setup-$($package.version).exe.sha256").FullName
            (Get-Item "release/latest.yml").FullName
          )
          & gh release upload $tag $releaseAssets --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release asset upload failed."
          }

          if ($package.version -match "-") {
            gh release edit $tag --title $package.version --draft=false --prerelease --latest=false
          } else {
            gh release edit $tag --title $package.version --draft=false --prerelease=false --latest
          }
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release publication failed."
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
